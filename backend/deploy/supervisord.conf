; supervisord.conf — runs API + Celery worker + beat in ONE container so all
; processes share the same mounted volume at /app/storage (Railway volumes
; are per-service and cannot be shared between services).

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0

[program:api]
command=uvicorn src.presentation.main:app --host 0.0.0.0 --port %(ENV_PORT)s
directory=/app
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

[program:celery_worker]
command=celery -A src.infrastructure.tasks.celery_app worker --pool=solo --loglevel=INFO
directory=/app
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20

[program:celery_beat]
command=celery -A src.infrastructure.tasks.celery_app beat --loglevel=INFO
directory=/app
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30
