[project]
name = "ai-video-studio"
version = "0.1.0"
description = "Autonomous AI-powered YouTube Content Studio"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "AI Video Studio Team" }]

dependencies = [
    # --- Web Framework ---
    "fastapi>=0.111.0,<0.112",
    "uvicorn[standard]>=0.30.0,<0.31",
    "python-multipart>=0.0.9",

    # --- Authentication ---
    "pyjwt>=2.9.0,<3.0",
    "passlib[bcrypt]>=1.7.4,<2.0",
    "bcrypt<4.0",
    "python-jose[cryptography]>=3.3.0,<4.0",

    # --- Database ---
    "sqlalchemy[asyncio]>=2.0.30,<2.1",
    "asyncpg>=0.29.0,<0.30",
    "psycopg2-binary>=2.9.9,<3.0",
    "alembic>=1.13.0,<1.14",

    # --- Cache & Task Queue ---
    "redis>=5.0.0,<6.0",
    "celery[redis]>=5.4.0,<5.5",
    "flower>=2.0.0,<3.0",

    # --- Validation & Settings ---
    "pydantic>=2.7.0,<3.0",
    "pydantic-settings>=2.2.0,<3.0",
    "email-validator>=2.1.0",
    "setuptools>=60.0",

    # --- AI / LLM ---
    "langgraph>=0.1.0,<0.2",
    "langchain-core>=0.2.0,<0.3",
    "langchain-google-genai>=1.0.0,<2.0",
    "google-generativeai>=0.7.0,<0.8",
    "google-genai>=1.75.0,<2.0",
    "google-cloud-aiplatform>=1.45.0,<2.0",
    "google-cloud-texttospeech>=0.5.0,<1.0",
    "edge-tts>=7.2.8,<8.0",

    # --- Video Processing ---
    "moviepy>=1.0.3,<2.0",

    # --- HTTP & Utilities ---
    "httpx>=0.28.1,<1.0",
    "aiofiles>=23.2.0,<24.0",
    "pillow>=10.3.0,<11.0",
    "pyyaml>=6.0.0,<7.0",

    # --- YouTube API ---
    "google-auth-oauthlib>=1.2.0,<2.0",
    "google-api-python-client>=2.130.0,<3.0",

    # --- Logging & Observability ---
    "structlog>=24.1.0,<25.0",
    "langfuse>=2.0,<3.0",

    # --- Pagination ---
    "fastapi-pagination>=0.12.0,<0.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0,<9.0",
    "pytest-asyncio>=0.23.0,<0.24",
    "pytest-cov>=5.0.0,<6.0",
    "pytest-mock>=3.12.0,<4.0",
    "httpx>=0.28.1,<1.0",
    "aiosqlite>=0.20.0,<0.21",
    "fakeredis>=2.21.0,<3.0",
    "ruff>=0.4.0,<0.5",
    "mypy>=1.10.0,<1.11",
    "types-passlib",
    "types-python-jose",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: unit tests (no external dependencies)",
    "integration: integration tests (require database/redis)",
    "mock_ai: tests using mocked AI providers",
    "api: API endpoint tests",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
namespace_packages = true
explicit_package_bases = true
