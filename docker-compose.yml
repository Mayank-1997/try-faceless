services:
  postgres:
    image: postgres:16-alpine
    container_name: aivideo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aivideo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aivideo_secret}
      POSTGRES_DB: ${POSTGRES_DB:-aivideo_studio}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aivideo} -d ${POSTGRES_DB:-aivideo_studio}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aivideo_net

  redis:
    image: redis:7-alpine
    container_name: aivideo_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aivideo_net

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aivideo_api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      uvicorn src.presentation.main:app
      --host ${APP_HOST:-0.0.0.0}
      --port ${APP_PORT:-8000}
      --reload
    networks:
      - aivideo_net

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aivideo_celery_worker
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      celery -A src.infrastructure.tasks.celery_app worker
      --loglevel=${APP_LOG_LEVEL:-INFO}
      --concurrency=${CELERY_WORKER_CONCURRENCY:-4}
      --prefetch-multiplier=${CELERY_WORKER_PREFETCH_MULTIPLIER:-1}
    networks:
      - aivideo_net

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aivideo_celery_beat
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy
    command: >
      celery -A src.infrastructure.tasks.celery_app beat
      --loglevel=${APP_LOG_LEVEL:-INFO}
    networks:
      - aivideo_net

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aivideo_web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
      # Mirrors the backend video-provider switch for the direct-cinematic
      # beat planner (kling | veo). Reads NEXT_PUBLIC_VIDEO_PROVIDER from .env.
      NEXT_PUBLIC_VIDEO_PROVIDER: ${NEXT_PUBLIC_VIDEO_PROVIDER:-veo}
      NEXT_PUBLIC_APP_VERSION: 0.0.0
      NEXT_PUBLIC_ENV: development
      # Windows bind mounts don't emit filesystem events into the
      # container — polling makes `next dev` hot-reload reliably.
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
      - web_app_node_modules:/app/apps/web/node_modules
      - web_next_cache:/app/apps/web/.next
    depends_on:
      - api
    networks:
      - aivideo_net

volumes:
  postgres_data:
  redis_data:
  web_node_modules:
  web_app_node_modules:
  web_next_cache:

networks:
  aivideo_net:
    driver: bridge
