# fly.toml app configuration file generated for try-faceless on 2026-10-30T13:18:07Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'try-faceless'
primary_region = 'sin'

[build]
  dockerfile = 'backend/Dockerfile.railway'

[env]
  APP_DEBUG = 'false'
  APP_ENV = 'production'
  APP_NAME = 'AI Video Studio'
  CORS_ORIGINS = 'http://localhost:3000'
  GOOGLE_TTS_ENABLED = 'false'
  KLING_ENABLED = 'true'
  PORT = '8000'
  REDIS_USE_TLS = 'true'
  STORAGE_LOCAL_PATH = '/app/storage'
  STORAGE_TYPE = 'local'
  USE_KLING = 'true'
  USE_VEO = 'false'

[[mounts]]
  source = 'aivideo_data'
  destination = '/app/storage'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '1m30s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 2048
